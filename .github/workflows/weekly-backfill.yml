name: Weekly Journal Backfill

on:
  schedule:
    # Runs every Sunday at 22:00 UTC
    - cron: '0 22 * * 0'
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore database
        uses: actions/cache@v4
        with:
          path: stockoracle.db
          key: stockoracle-db-backfill-${{ github.run_id }}
          restore-keys: |
            stockoracle-db-

      - name: Run backfill and journal summary
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python -c "import database; database.init_db()"
          python - <<'PY'
          import database
          from journal import backfill_forward_returns

          database.init_db()
          with database.get_connection() as conn:
              backfill_forward_returns(conn)
          print("backfilled")
          PY
          python print_journal.py

      - name: Upload updated database
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockoracle-db-backfill-${{ github.run_number }}
          path: stockoracle.db
          retention-days: 90
