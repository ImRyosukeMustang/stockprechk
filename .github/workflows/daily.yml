name: Daily SMA Pipeline

on:
  schedule:
    # Runs at 21:30 UTC (5:30pm ET) Mon-Fri, after US market close
    - cron: '30 21 * * 1-5'
  workflow_dispatch:   # Allow manual trigger from Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore database from previous run
        uses: actions/cache@v4
        with:
          path: stockoracle.db
          key: stockoracle-db-${{ github.run_id }}
          restore-keys: |
            stockoracle-db-

      - name: Initialize database (if fresh)
        run: python database.py

      - name: Run SMA pipeline once
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scheduler.py --once

      - name: Print journal summary
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python print_journal.py

      - name: Upload database as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockoracle-db-run-${{ github.run_number }}
          path: stockoracle.db
          retention-days: 90
